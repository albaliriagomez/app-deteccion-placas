name: appdeteccion
description: App de fotodeteccion vehicular
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  google_fonts: ^8.1.0
  http: ^1.2.1
  intl: ^0.20.2

  shared_preferences: ^2.3.2

  path_provider: ^2.1.5

  permission_handler: ^11.3.1

  speech_to_text: ^7.0.0

  # MAPAS
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # IA / CAMARA
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.15.1
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/best_int8.tflite
    - assets/labels.txt
    - assets/Escudo-GAMC-vertical_CMYK.png
    - assets/Logo Yo Amo Cocha Oficial 1.png