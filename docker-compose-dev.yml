version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: lpr-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lpr-network

  backend:
    build: .
    container_name: lpr-backend-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - lpr-network

networks:
  lpr-network:
    driver: bridge

volumes:
  postgres_data: